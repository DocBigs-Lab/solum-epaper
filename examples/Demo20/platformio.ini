; Demo fuer das Solum 2,0"-Panel (Epd20), baut gegen die Bibliothek in diesem Repo.
;
;   esp32dev  Waveshare e-Paper ESP32 Driver Board (Schalter 1 = B, 2 = ON)
;   esp32c6   Seengreat ESP32-C6 E-Paper Driver Board (S1 = ON, S2 = ON)
;
; Aufruf: cd examples/Demo20 && pio run -e esp32c6 -t upload -t monitor

[platformio]
src_dir = .

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    symlink://../..

[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=0

; ESP32-C6 braucht Arduino-Core 3.x -> pioarduino statt der offiziellen espressif32.
[env:esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
; Das DevKitC-1 hat 8 MB, der C6 auf dem Seengreat-Board nur 4 MB.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_SEENGREAT_C6
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
