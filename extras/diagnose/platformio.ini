; Diagnosefirmware fuer die Solum-Panels (Serial-Menue, 115200 Baud).
; Eigenstaendig, nutzt die Bibliothek nicht. Anleitung: ../../doc/diagnose.md
; Fertige .bin fuer beide Boards: ./make-bin.sh -> bin/

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; DTR/RTS beim Oeffnen nicht setzen, sonst Reset (C6: USB-Verbindung bricht ab)
monitor_dtr = 0
monitor_rts = 0
build_flags =
    -DCORE_DEBUG_LEVEL=0

; Seengreat ESP32-C6 E-Paper Driver Board, S1 = ON (4-Draht), S2 = ON (0,47 Ohm).
; ESP32-C6 braucht Arduino-Core 3.x -> pioarduino statt der offiziellen espressif32.
[env:esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
; Das DevKitC-1 hat 8 MB, der C6 auf dem Seengreat-Board nur 4 MB. Ohne diese
; Angabe startet ein direkt geflashtes Image nicht (Detected size 4096k < 8192k).
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
framework = arduino
monitor_speed = 115200
; DTR/RTS beim Oeffnen nicht setzen, sonst Reset (C6: USB-Verbindung bricht ab)
monitor_dtr = 0
monitor_rts = 0
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_SEENGREAT_C6
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
