sentence=Driver for the 2.0" black/white/yellow/red e-paper from SOLUM shelf labels (EL020L8C4C, FPC-8161).
paragraph=Epd20: 200x152, four colours (black, white, yellow, red), 2 bit per pixel. Init sequence after the OpenEPaperLink Solum firmware. Adafruit GFX based. Tested on the Seengreat ESP32-C6 E-Paper Driver Board; the Waveshare e-Paper ESP32 Driver Board should work (same pinout) but is not tested yet.
